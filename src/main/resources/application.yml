server:
  port: 8081  # Puerto donde corre este servicio

spring:
  application:
    name: profiles-service  # 👈 Nombre con el que se registrará en Eureka
  rabbitmq:
    host: localhost   # O la IP/nombre del contenedor Docker (si es diferente)
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
